{% extends "base.html" %}

{% block title %}Get started – News Reporter{% endblock %}

{% block content %}
<div class="max-w-md mx-auto animate-fade">
    <div class="text-center mb-8">
        <h1 class="text-3xl sm:text-4xl font-semibold text-ink mb-3">Start your digest</h1>
        <p class="text-ink-muted">Free daily news, tailored to your morning.</p>
    </div>

    <div class="clay-surface rounded-clay-lg p-7 sm:p-9">
        <form id="registerForm" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-ink mb-2">Full name</label>
                <input type="text" id="fullName" required placeholder="Your name"
                    class="clay-input w-full rounded-xl px-4 py-3 text-ink placeholder:text-ink-faint text-sm">
            </div>

            <div>
                <label class="block text-sm font-medium text-ink mb-2">Email</label>
                <input type="email" id="email" required placeholder="you@example.com"
                    class="clay-input w-full rounded-xl px-4 py-3 text-ink placeholder:text-ink-faint text-sm">
            </div>

            <div>
                <label class="block text-sm font-medium text-ink mb-2">Password</label>
                <input type="password" id="password" required minlength="6" placeholder="At least 6 characters"
                    class="clay-input w-full rounded-xl px-4 py-3 text-ink placeholder:text-ink-faint text-sm">
            </div>

            <div>
                <label class="block text-sm font-medium text-ink mb-2">Delivery time <span class="text-ink-faint font-normal">(PKT)</span></label>
                <div class="relative">
                    <select id="preferredHour" required
                        class="clay-input appearance-none w-full rounded-xl px-4 py-3 text-ink text-sm cursor-pointer">
                        <option value="6">6:00 AM</option>
                        <option value="7" selected>7:00 AM</option>
                        <option value="8">8:00 AM</option>
                        <option value="9">9:00 AM</option>
                        <option value="10">10:00 AM</option>
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-ink-faint">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </div>
                </div>
            </div>

            <button type="submit"
                class="w-full py-3.5 rounded-full btn-accent text-sm font-medium mt-2">
                Create account
            </button>
        </form>

        <p class="mt-8 pt-6 border-t border-ink/5 text-center text-sm text-ink-muted">
            Already subscribed?
            <a href="/login" class="text-ink font-medium hover:text-accent ml-1">Sign in</a>
        </p>

        <p id="error" class="mt-4 text-accent text-sm text-center hidden"></p>
    </div>
</div>

<script>
    document.getElementById("registerForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const btn = e.target.querySelector('button[type="submit"]');
        window.showSpinner(btn);

        const errorEl = document.getElementById("error");
        errorEl.classList.add("hidden");

        const emailVal = document.getElementById("email").value;

        const res = await fetch("/auth/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                email: emailVal,
                password: document.getElementById("password").value,
                full_name: document.getElementById("fullName").value,
                preferred_hour: parseInt(document.getElementById("preferredHour").value)
            })
        });

        if (res.ok) {
            window.location.href = `/verify?email=${encodeURIComponent(emailVal)}`;
        } else {
            const data = await res.json();
            errorEl.textContent = data.detail || "Registration failed. Please try again.";
            errorEl.classList.remove("hidden");
            window.hideSpinner(btn);
        }
    });
</script>
{% endblock %}
