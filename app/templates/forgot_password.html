{% extends "base.html" %}

{% block title %}Forgot password – Daily Digest{% endblock %}

{% block content %}
<div class="max-w-md mx-auto animate-fade">
    <div class="text-center mb-8">
        <h1 class="text-3xl sm:text-4xl font-semibold text-ink mb-3">Reset your password</h1>
        <p class="text-ink-muted">Enter your email and we’ll send a reset link if an account exists.</p>
    </div>

    <div class="clay-surface rounded-clay-lg p-7 sm:p-9">
        <form id="forgotForm" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-ink mb-2">Email</label>
                <input type="email" id="email" required placeholder="you@example.com"
                    autocomplete="email" inputmode="email"
                    class="clay-input w-full rounded-xl px-4 py-3 text-ink placeholder:text-ink-faint text-sm">
            </div>
            <button type="submit" class="w-full py-3.5 rounded-full btn-primary text-sm font-medium">
                Send reset link
            </button>
        </form>

        <p class="mt-8 pt-6 border-t border-ink/5 text-center text-sm text-ink-muted">
            Remembered it?
            <a href="/login" class="text-ink font-medium hover:text-accent ml-1">Sign in</a>
        </p>

        <p id="error" class="mt-4 text-ink text-sm text-center hidden"></p>
    </div>
</div>

<script>
    document.getElementById("forgotForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const btn = e.target.querySelector('button[type="submit"]');
        window.showSpinner(btn);

        const errorEl = document.getElementById("error");
        errorEl.classList.add("hidden");

        const emailVal = document.getElementById("email").value.trim();
        const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(emailVal);
        if (!emailOk) {
            errorEl.textContent = "Please enter a valid email address.";
            errorEl.classList.remove("hidden");
            window.hideSpinner(btn);
            return;
        }

        const res = await fetch("/auth/forgot-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email: emailVal })
        });

        const data = await res.json().catch(() => ({}));
        if (res.ok) {
            errorEl.textContent = "If that email is registered, we sent a reset link. Check your inbox.";
            errorEl.classList.remove("hidden");
            btn.disabled = true;
            return;
        }

        errorEl.textContent = window.formatApiError(data, "Could not send a reset link. Try again.");
        errorEl.classList.remove("hidden");
        window.hideSpinner(btn);
    });
</script>
{% endblock %}
