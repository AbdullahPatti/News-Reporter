<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Daily Digest{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap"
        rel="stylesheet">
    <link rel="preload" href="/static/fonts/Agrandir-Narrow.otf" as="font" type="font/otf" crossorigin>
    <link rel="preload" href="/static/fonts/GaliModern-UltraLight.otf" as="font" type="font/otf" crossorigin>
    <link rel="preload" href="/static/fonts/Gazpacho-Black.otf" as="font" type="font/otf" crossorigin>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Gabarito', 'system-ui', 'sans-serif'],
                        serif: ['Agrandir Narrow', 'Georgia', 'serif'],
                        display: ['Gazpacho', 'Georgia', 'serif'],
                        elegant: ['Gali Modern', 'Georgia', 'serif'],
                    },
                    colors: {
                        ink: {
                            DEFAULT: '#1a1a2e',
                            muted: '#6b6b8d',
                            faint: '#a8a8c8',
                        },
                        canvas: {
                            DEFAULT: '#faf9f7',
                            warm: '#f3f1ee',
                            card: '#ffffff',
                        },
                        accent: {
                            DEFAULT: '#2d6a4f',
                            soft: '#e8f3ed',
                            dark: '#1b4d32',
                        },
                    },
                    boxShadow: {
                        clay: '8px 8px 16px rgba(26,26,46,0.06), -4px -4px 12px rgba(255,255,255,0.9), inset 0 1px 0 rgba(255,255,255,0.8)',
                        'clay-sm': '4px 4px 12px rgba(26,26,46,0.05), -2px -2px 8px rgba(255,255,255,0.85), inset 0 1px 0 rgba(255,255,255,0.7)',
                        'clay-inset': 'inset 2px 2px 6px rgba(26,26,46,0.06), inset -2px -2px 6px rgba(255,255,255,0.9)',
                        float: '0 20px 40px -12px rgba(26,26,46,0.12)',
                    },
                    borderRadius: {
                        clay: '1.25rem',
                        'clay-lg': '1.75rem',
                    },
                }
            }
        }
    </script>

    <style>
        @font-face {
            font-family: 'Agrandir Narrow';
            src: url('/static/fonts/Agrandir-Narrow.otf') format('opentype');
            font-weight: 400 700;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Gali Modern';
            src: url('/static/fonts/GaliModern-UltraLight.otf') format('opentype');
            font-weight: 200;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Gazpacho';
            src: url('/static/fonts/Gazpacho-Black.otf') format('opentype');
            font-weight: 900;
            font-style: normal;
            font-display: swap;
        }

        body {
            font-family: 'Gabarito', system-ui, sans-serif;
            background-color: #faf9f7;
            color: #1a1a2e;
            -webkit-font-smoothing: antialiased;
        }

        h1,
        h2,
        h3,
        .serif {
            font-family: 'Agrandir Narrow', Georgia, serif;
            font-optical-sizing: auto;
        }

        .font-display {
            font-family: 'Gazpacho', Georgia, serif;
        }

        .font-elegant {
            font-family: 'Gali Modern', Georgia, serif;
        }

        a,
        button,
        input,
        select {
            transition: color 0.2s ease, background-color 0.2s ease, border-color 0.2s ease,
                box-shadow 0.2s ease, transform 0.2s ease, opacity 0.2s ease;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade {
            animation: fadeUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            opacity: 0;
        }

        .stagger-1 {
            animation-delay: 80ms;
        }

        .stagger-2 {
            animation-delay: 160ms;
        }

        .stagger-3 {
            animation-delay: 240ms;
        }

        .clay-surface {
            background: linear-gradient(145deg, #ffffff 0%, #f3f1ee 100%);
            box-shadow: 8px 8px 16px rgba(26, 26, 46, 0.06), -4px -4px 12px rgba(255, 255, 255, 0.9),
                inset 0 1px 0 rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .clay-input {
            background: #f5f3f0;
            box-shadow: inset 2px 2px 6px rgba(26, 26, 46, 0.05), inset -1px -1px 4px rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(26, 26, 46, 0.06);
        }

        .clay-input:focus {
            outline: none;
            background: #faf9f7;
            border-color: rgba(45, 106, 79, 0.35);
            box-shadow: inset 2px 2px 6px rgba(26, 26, 46, 0.04), 0 0 0 3px rgba(45, 106, 79, 0.12);
        }

        .nav-blur {
            background: rgba(250, 249, 247, 0.82);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border-bottom: 1px solid rgba(26, 26, 46, 0.06);
        }

        .btn-primary {
            background: linear-gradient(180deg, #1a1a2e 0%, #2d2d44 100%);
            color: #fff;
            box-shadow: 0 1px 2px rgba(26, 26, 46, 0.12), 0 4px 12px rgba(26, 26, 46, 0.15);
        }

        .btn-primary:hover {
            background: linear-gradient(180deg, #2d2d44 0%, #3d3d55 100%);
            box-shadow: 0 2px 4px rgba(26, 26, 46, 0.14), 0 8px 20px rgba(26, 26, 46, 0.18);
            transform: translateY(-1px);
        }

        .btn-accent {
            background: linear-gradient(180deg, #2d6a4f 0%, #1b4d32 100%);
            color: #fff;
            box-shadow: 0 1px 2px rgba(45, 106, 79, 0.2), 0 4px 14px rgba(45, 106, 79, 0.25);
        }

        .btn-accent:hover {
            background: linear-gradient(180deg, #3a7d5c 0%, #255a3f 100%);
            transform: translateY(-1px);
        }

        .spinner {
            border: 2px solid rgba(255, 255, 255, 0.25);
            border-radius: 50%;
            border-top-color: currentColor;
            width: 18px;
            height: 18px;
            animation: spin 0.7s linear infinite;
            display: inline-block;
        }

        .btn-spinner {
            border-top-color: white;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .divider-dot::before {
            content: '·';
            margin: 0 0.5rem;
            color: #a8a8c8;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col">

    <nav class="nav-blur sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-5 sm:px-8 h-[4.25rem] flex items-center justify-between">
            <a href="/" class="flex items-center gap-2.5 group">
                <span
                    class="w-8 h-8 rounded-xl bg-gradient-to-br from-accent to-accent-dark flex items-center justify-center shadow-clay-sm">
                    <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" stroke-width="2"
                        viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z" />
                    </svg>
                </span>
                <span class="text-lg font-semibold tracking-tight text-ink font-display">Daily Digest</span>
            </a>

            <div class="flex items-center gap-1 sm:gap-2 text-sm">
                {% if user %}
                <a href="/dashboard"
                    class="hidden sm:inline-flex px-3.5 py-2 rounded-full text-ink-muted hover:text-ink hover:bg-white/60 font-medium">Dashboard</a>
                <a href="/dashboard/preferences"
                    class="hidden sm:inline-flex px-3.5 py-2 rounded-full text-ink-muted hover:text-ink hover:bg-white/60 font-medium">Preferences</a>
                <span class="hidden md:block px-3 text-ink-faint text-sm">{{ user.full_name }}</span>
                <form action="/auth/logout" method="post" class="inline">
                    <button type="submit"
                        class="px-3.5 py-2 rounded-full text-ink-muted hover:text-ink hover:bg-white/60 font-medium">Sign
                        out</button>
                </form>
                {% else %}
                <a href="/login"
                    class="px-3.5 py-2 rounded-full text-ink-muted hover:text-ink hover:bg-white/60 font-medium">Sign
                    in</a>
                <a href="/register" class="ml-1 px-5 py-2.5 rounded-full btn-primary text-sm font-medium">Get
                    started</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="flex-grow w-full max-w-5xl mx-auto px-5 sm:px-8 py-10 sm:py-14 md:py-16">
        {% block content %}{% endblock %}
    </main>

    <footer class="mt-auto border-t border-ink/5 py-10">
        <div
            class="max-w-5xl mx-auto px-5 sm:px-8 flex flex-col sm:flex-row items-center justify-between gap-4 text-sm text-ink-faint">
            <p>&copy; 2026 Daily Digest</p>
            <p class="text-center sm:text-right">AI-powered daily digest · Pakistan &amp; world news</p>
        </div>
    </footer>

    <script>
        window.showSpinner = function (btn) {
            if (!btn) return;
            if (!btn.dataset.originalText) btn.dataset.originalText = btn.innerHTML;
            btn.innerHTML = '<div class="spinner btn-spinner mx-auto"></div>';
            btn.disabled = true;
            btn.classList.add('opacity-70', 'cursor-not-allowed');
        };

        window.formatApiError = function (data, fallback) {
            if (!data) return fallback;
            const detail = data.detail;
            if (typeof detail === "string") return detail;
            if (Array.isArray(detail)) {
                return detail.map(function (err) {
                    const msg = (err && err.msg) ? err.msg : String(err);
                    const loc = ((err && err.loc) || []).join(" ").toLowerCase();
                    if (msg.toLowerCase().includes("email") || loc.includes("email")) {
                        return "Please enter a valid email address.";
                    }
                    if (loc.includes("password") || msg.toLowerCase().includes("password")) {
                        return msg.replace(/^Value error,\s*/i, "");
                    }
                    return msg.replace(/^Value error,\s*/i, "");
                }).join(" ");
            }
            return fallback;
        };

        window.hideSpinner = function (btn) {
            if (!btn) return;
            if (btn.dataset.originalText) btn.innerHTML = btn.dataset.originalText;
            btn.disabled = false;
            btn.classList.remove('opacity-70', 'cursor-not-allowed');
        };

        document.addEventListener("submit", function (e) {
            const btn = e.target.querySelector('button[type="submit"]');
            if (btn && !e.defaultPrevented) window.showSpinner(btn);
        });
    </script>
</body>

</html>
